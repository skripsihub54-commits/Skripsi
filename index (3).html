<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKRIPSIHUB - Pendamping Skripsi AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
.paper{font-family:"Times New Roman",serif;line-height:1.8;text-align:justify;font-size:14px}
.paper p{text-indent:1.25cm;margin:0 0 .4rem}
.paper h1{text-align:center;font-weight:700;text-transform:uppercase}
.paper h2,.paper h3{font-weight:700;margin-top:.8rem}.paper h3{font-style:italic}
.out p{margin:0 0 .5rem}.out h2,.out h3{font-weight:700;margin-top:.6rem}
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<header class="sticky top-0 z-20 bg-white border-b px-4 py-2 flex items-center justify-between gap-2">
  <b class="text-indigo-600 text-lg">SKRIPSIHUB</b>
  <div class="flex gap-2 items-center">
    <span id="badge" class="text-xs px-2 py-1 rounded-full font-semibold"></span>
    <button onclick="openSet()" class="text-xs border rounded-lg px-3 py-1.5 font-semibold">⚙ Pengaturan</button>
  </div>
</header>
<nav id="nav" class="flex gap-1 overflow-x-auto bg-white border-b px-2 py-1.5 text-xs whitespace-nowrap"></nav>
<main id="main" class="max-w-5xl mx-auto p-4 space-y-4"></main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-5 w-full max-w-md space-y-3">
    <h3 class="font-bold text-lg">Pengaturan AI</h3>
    <p class="text-xs text-slate-500">Web ini memanggil Google Gemini langsung dari browser (tanpa server). Ambil API key gratis di <a class="text-indigo-600 underline" target="_blank" href="https://aistudio.google.com/apikey">aistudio.google.com/apikey</a>. Key hanya tersimpan di browser ini. Jangan menulis key di dalam file HTML/GitHub.</p>
    <input id="set-key" type="password" placeholder="Tempel API key Gemini" class="w-full border rounded-xl p-2.5 text-sm">
    <select id="set-model" class="w-full border rounded-xl p-2.5 text-sm">
      <option value="gemini-2.5-flash">gemini-2.5-flash (cepat, disarankan)</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro (lebih cermat, lebih lambat)</option>
      <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (paling ringan)</option>
    </select>
    <div class="flex gap-2 justify-end">
      <button onclick="$('#modal').classList.add('hidden')" class="px-4 py-2 text-sm border rounded-xl">Batal</button>
      <button onclick="saveSet()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-xl font-semibold">Simpan</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROM = {1:'I',2:'II',3:'III',4:'IV',5:'V'};
const NAMA = {1:'PENDAHULUAN',2:'KAJIAN PUSTAKA',3:'METODE PENELITIAN',4:'HASIL DAN PEMBAHASAN',5:'PENUTUP'};
const WPP = 380; // perkiraan kata per halaman (TNR 12, spasi 1,5)

// Subbab dan target kata minimum (disesuaikan dengan target halaman)
const OUT = {
 1:['A. Latar Belakang Masalah|1200','B. Identifikasi dan Rumusan Masalah|350','C. Tujuan Penelitian|250','D. Manfaat Penelitian|400','E. Ruang Lingkup dan Batasan Penelitian|250','F. Definisi Istilah|250'],
 2:['A. Landasan Teori: Konsep Dasar Variabel/Fokus Pertama|1300','B. Dimensi, Indikator, dan Faktor yang Memengaruhi Variabel/Fokus Pertama|1300','C. Landasan Teori: Konsep Dasar Variabel/Fokus Kedua|1300','D. Dimensi, Indikator, dan Faktor Variabel/Fokus Kedua|1300','E. Hubungan Antarvariabel/Fokus Penelitian|900','F. Penelitian Terdahulu yang Relevan|1200','G. Kerangka Berpikir|500','H. Hipotesis atau Pertanyaan Penelitian|300'],
 3:['A. Jenis dan Pendekatan Penelitian|400','B. Lokasi dan Waktu Penelitian|250','C. Populasi dan Sampel / Subjek Penelitian|500','D. Variabel dan Definisi Operasional|600','E. Teknik dan Instrumen Pengumpulan Data|600','F. Uji Validitas dan Reliabilitas / Keabsahan Data|450','G. Teknik Analisis Data|700','H. Prosedur Penelitian|300'],
 4:['A. Gambaran Umum Objek Penelitian|1200','B. Deskripsi Karakteristik Responden / Subjek|1500','C. Hasil Uji Instrumen / Keabsahan Data|1500','D. Deskripsi Data Setiap Variabel / Temuan|2000','E. Uji Prasyarat Analisis|1500','F. Pengujian Hipotesis / Analisis Temuan Utama|2000','G. Pembahasan Temuan Pertama|2000','H. Pembahasan Temuan Kedua|2000','I. Pembahasan Integratif, Implikasi, dan Keterbatasan|1500'],
 5:['A. Kesimpulan|500','B. Implikasi|400','C. Saran|500']
};

const SYS = `Anda penulis akademik Indonesia berpengalaman yang membantu mahasiswa menyusun skripsi. Gunakan bahasa Indonesia baku (PUEBI), nada ilmiah, paragraf utuh 4-6 kalimat dengan argumen yang runtut dan logis, bukan daftar poin kecuali diminta. Tulis dengan kata-kata orisinal. DILARANG mengarang data, angka statistik, kutipan langsung, nama penulis, atau sumber. Sitasi hanya boleh memakai daftar referensi terverifikasi yang diberikan. Jangan memakai simbol markdown tebal (**), jangan membuat tabel.`;

const S = (() => { try { return JSON.parse(localStorage.getItem('sh') || 'null'); } catch (e) { return null; } })() ||
 { key:'', model:'gemini-2.5-flash', p:{judul:'',jenis:'Skripsi (S1)',metode:'Kuantitatif',nama:'',nim:'',prodi:'',data:''}, babs:{}, refs:[] };
const save = () => { try { localStorage.setItem('sh', JSON.stringify(S)); } catch (e) {} };
let cur = 1, stop = false, lastFound = [];

// ---------- Panggilan AI (langsung ke Gemini dari browser) ----------
async function ai(prompt, sys, max = 8192) {
  if (!S.key) { openSet(); throw new Error('Isi API key Gemini dulu di menu Pengaturan.'); }
  for (let a = 1; a <= 4; a++) {
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: sys || SYS }] },
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: max }
      })
    });
    const j = await r.json().catch(() => ({}));
    if ((r.status === 429 || r.status === 503) && a < 4) {
      status(`Server AI sibuk/kuota penuh, menunggu ${a * 20} detik lalu mencoba lagi...`);
      await new Promise(z => setTimeout(z, a * 20000)); continue;
    }
    if (!r.ok) throw new Error(j.error?.message || 'HTTP ' + r.status);
    const t = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    if (!t) throw new Error('Respons kosong atau diblokir filter keamanan.');
    return t;
  }
}

// ---------- Referensi nyata dari OpenAlex ----------
async function findRefs(q, n) {
  const u = `https://api.openalex.org/works?search=${encodeURIComponent(q)}&per-page=${n}&filter=has_doi:true,type:article`;
  const j = await (await fetch(u)).json();
  return (j.results || []).map(w => {
    const names = (w.authorships || []).map(x => x.author?.display_name).filter(Boolean);
    if (!names.length || !w.title || !w.publication_year) return null;
    const fmt = nm => { const p = nm.split(' '); const l = p.pop(); return `${l}, ${p.map(x => x[0] + '.').join(' ')}`.trim(); };
    const last = names[0].split(' ').pop(), y = w.publication_year;
    const src = w.primary_location?.source?.display_name || '';
    return { last, y, key: `${last}${names.length > 1 ? ' dkk.' : ''}, ${y}`, doi: w.doi,
      full: `${names.slice(0, 6).map(fmt).join(', ')} (${y}). ${w.title}. ${src}${src ? '. ' : ''}${w.doi}` };
  }).filter(Boolean);
}

// ---------- Markdown sederhana -> HTML ----------
const clean = l => l.replace(/\*\*|__/g, '').replace(/^\s*[-*]\s+/, '• ');
const md = t => String(t || '').split(/\n+/).map(l => {
  l = l.trim(); if (!l) return '';
  if (l.startsWith('### ')) return `<h3>${esc(clean(l.slice(4)))}</h3>`;
  if (l.startsWith('## ')) return `<h2>${esc(clean(l.slice(3)))}</h2>`;
  if (l.startsWith('# ')) return `<h1>${esc(clean(l.slice(2)))}</h1>`;
  return `<p>${esc(clean(l))}</p>`;
}).join('');
const words = t => (String(t || '').trim().match(/\S+/g) || []).length;
const status = m => { const e = $('#status'); if (e) e.textContent = m; };

// ---------- Tampilan ----------
const TABS = [['studio','Studio Skripsi'],['judul','Judul'],['layak','Kelayakan'],['novelty','Novelty'],['artikel','Jurnal'],['ebook','Ebook'],['data','Statistik'],['sidang','Sidang'],['plag','Kemiripan'],['ref','Verifikasi Ref'],['para','Parafrase']];
const T = {
 judul:['Brainstorming Judul','Topik / bidang studi, mis. pengaruh motivasi belajar terhadap hasil belajar siswa', t => `Buat 10 rekomendasi judul ${S.p.jenis} yang spesifik dan layak diteliti (memuat variabel, objek, dan konteks) untuk topik: ${t}. Format daftar bernomor, tiap judul diikuti satu kalimat alasan kelayakan.`],
 layak:['Uji Kelayakan Judul','Tempel judul skripsi...', t => `Nilai kelayakan judul berikut sebagai ${S.p.jenis}: "${t}". Evaluasi kejelasan variabel, kesesuaian metode, ketersediaan data, cakupan, dan risiko. Beri skor 1-10 per aspek dan usulkan revisi judul.`],
 novelty:['Temukan Novelty','Judul / topik...', t => `Untuk topik "${t}", sarankan 5 celah penelitian (research gap) dan sudut kebaruan yang realistis untuk ${S.p.jenis}, lengkap dengan alasan dan cara merumuskannya. Jangan menyebut artikel atau data spesifik yang tidak bisa diverifikasi.`],
 sidang:['Simulasi Sidang','Judul + ringkasan penelitian...', t => `Berperan sebagai dosen penguji. Berdasarkan penelitian berikut, ajukan 10 pertanyaan sidang dari mudah ke sulit, masing-masing dengan poin jawaban ideal singkat:\n${t}`],
 plag:['Cek Risiko Kemiripan','Tempel teks yang ingin dianalisis...', t => `Analisis teks berikut dari sisi risiko kemiripan: tandai kalimat yang terlalu generik/klise atau meniru gaya sumber, dan beri versi perbaikan yang lebih orisinal. Di awal, sebutkan bahwa ini analisis gaya oleh AI, bukan pengganti Turnitin.\n${t}`],
 para:['Parafrase Akademik','Tempel teks (sitasi akan dipertahankan)...', t => `Parafrasekan teks berikut ke bahasa Indonesia akademik baku dengan struktur kalimat dan pilihan kata berbeda. Pertahankan makna dan semua sitasi:\n${t}`]
};

function nav(v) {
  $('#nav').innerHTML = TABS.map(([k, n]) => `<button onclick="nav('${k}')" class="px-3 py-1.5 rounded-lg font-semibold ${k === v ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">${n}</button>`).join('');
  const m = $('#main');
  if (v === 'studio') return studio();
  if (T[v]) {
    const [n, ph, f] = T[v];
    m.innerHTML = `<div class="bg-white border rounded-2xl p-5 space-y-3"><h2 class="font-bold text-xl">${n}</h2>
      <textarea id="tin" rows="6" class="w-full border rounded-xl p-3 text-sm" placeholder="${ph}"></textarea>
      <button id="tgo" class="bg-indigo-600 text-white font-semibold px-5 py-2.5 rounded-xl text-sm">Proses dengan AI</button></div>
      <div id="tout" class="out bg-white border rounded-2xl p-5 text-sm hidden"></div>`;
    $('#tgo').onclick = async () => {
      const t = $('#tin').value.trim(); if (!t) return;
      const o = $('#tout'); o.classList.remove('hidden'); o.textContent = 'Memproses...'; $('#tgo').disabled = true;
      try { o.innerHTML = md(await ai(f(t))); } catch (e) { o.textContent = 'Gagal: ' + e.message; }
      $('#tgo').disabled = false;
    };
    return;
  }
  if (v === 'artikel' || v === 'ebook' || v === 'ref') {
    const cfg = { artikel:['Cari Artikel Jurnal (OpenAlex)','Kata kunci topik...'], ebook:['Cari Buku (Open Library)','Judul / topik buku...'], ref:['Verifikasi Referensi (Crossref)','Tempel satu referensi/judul artikel...'] }[v];
    m.innerHTML = `<div class="bg-white border rounded-2xl p-5 space-y-3"><h2 class="font-bold text-xl">${cfg[0]}</h2>
      <div class="flex gap-2"><input id="q" class="flex-1 border rounded-xl p-3 text-sm" placeholder="${cfg[1]}"><button id="qgo" class="bg-indigo-600 text-white px-5 rounded-xl text-sm font-semibold">Cari</button></div></div><div id="qout" class="space-y-3"></div>`;
    $('#qgo').onclick = () => search(v);
    $('#q').onkeydown = e => { if (e.key === 'Enter') search(v); };
    return;
  }
  if (v === 'data') {
    m.innerHTML = `<div class="bg-white border rounded-2xl p-5 space-y-3"><h2 class="font-bold text-xl">Olah Data Statistik (tanpa AI)</h2>
      <p class="text-xs text-slate-500">Tempel data angket (baris pertama = nama butir; pemisah koma, titik koma, atau tab). Dihitung langsung di browser: rata-rata, simpangan baku, korelasi butir-total (validitas), dan Cronbach's Alpha.</p>
      <textarea id="csv" rows="8" class="w-full border rounded-xl p-3 text-xs font-mono" placeholder="X1,X2,X3,X4\n4,5,3,5\n3,4,2,4\n5,5,4,5\n4,4,4,4"></textarea>
      <button onclick="stats()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold">Hitung</button></div>
      <div id="sout" class="bg-white border rounded-2xl p-5 overflow-x-auto text-xs"></div>`;
  }
}

function studio() {
  const p = S.p;
  const inp = (id, l, v, ph) => `<div><label class="block text-xs font-bold mb-1">${l}</label><input id="${id}" value="${esc(v)}" placeholder="${ph}" class="w-full border rounded-xl p-2.5 text-sm"></div>`;
  $('#main').innerHTML = `
  <div class="bg-white border rounded-2xl p-5 space-y-3">
    <h2 class="font-bold text-xl">Pengaturan Proyek</h2>
    <div><label class="block text-xs font-bold mb-1">Judul Penelitian</label><textarea id="f-judul" rows="2" class="w-full border rounded-xl p-3 text-sm">${esc(p.judul)}</textarea></div>
    <div class="grid md:grid-cols-2 gap-3">
      <div><label class="block text-xs font-bold mb-1">Jenis Karya</label><select id="f-jenis" class="w-full border rounded-xl p-2.5 text-sm">${['Skripsi (S1)','Tesis (S2)','Disertasi (S3)'].map(o => `<option ${o === p.jenis ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
      <div><label class="block text-xs font-bold mb-1">Metode</label><select id="f-metode" class="w-full border rounded-xl p-2.5 text-sm">${['Kuantitatif','Kualitatif','Eksperimen','Studi Pustaka'].map(o => `<option ${o === p.metode ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
    </div>
    <div class="grid md:grid-cols-3 gap-3">${inp('f-nama','Nama',p.nama,'Nama lengkap')}${inp('f-nim','NIM',p.nim,'NIM')}${inp('f-prodi','Prodi / Kampus',p.prodi,'Prodi - Universitas')}</div>
    <div><label class="block text-xs font-bold mb-1">Data Real Penelitian (untuk Bab IV & V)</label><textarea id="f-data" rows="4" class="w-full border rounded-xl p-3 text-sm" placeholder="Tempel hasil olah data, ringkasan angket, atau temuan wawancara yang sebenarnya. Jika kosong, AI hanya membuat kerangka dengan penanda [ISI DATA] dan tidak mengarang angka.">${esc(p.data)}</textarea></div>
    <button onclick="saveProj(true)" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl text-sm">Simpan Parameter</button>
  </div>
  <div class="bg-white border rounded-2xl p-5 space-y-3">
    <div class="flex flex-wrap gap-2 justify-between items-center">
      <div class="flex gap-1">${[1,2,3,4,5].map(n => `<button onclick="cur=${n};studio()" class="px-4 py-2 rounded-xl text-xs font-bold ${n === cur ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">BAB ${ROM[n]}</button>`).join('')}</div>
      <button onclick="dl()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Unduh Word (.docx)</button>
    </div>
    <div class="flex flex-wrap gap-2 items-center bg-slate-50 border rounded-xl p-3">
      <span id="status" class="text-xs font-semibold text-slate-600 flex-1 min-w-[10rem]">Referensi tersimpan: ${S.refs.length}. Target Bab ${ROM[cur]}: sekitar ${Math.round(OUT[cur].reduce((s, x) => s + +x.split('|')[1], 0) / WPP)} halaman.</span>
      <button id="gen" onclick="gen(cur)" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Generate Bab ${ROM[cur]}</button>
      <button id="stp" onclick="stop=true" class="hidden bg-rose-600 text-white px-4 py-2 rounded-xl text-xs font-semibold">Hentikan</button>
      <button onclick="toggleEdit()" class="border px-4 py-2 rounded-xl text-xs font-semibold">Edit / Pratinjau</button>
    </div>
    <div class="text-[11px] text-slate-500" id="count"></div>
    <div id="paper" class="paper bg-white border rounded-xl p-6 min-h-[300px] max-h-[600px] overflow-y-auto"></div>
    <textarea id="ed" class="hidden w-full h-[500px] border rounded-xl p-3 text-xs font-mono"></textarea>
  </div>`;
  render();
}
function render() {
  const t = S.babs[cur] || '';
  const pv = $('#paper'); if (!pv) return;
  pv.innerHTML = t ? md(t) : '<p class="text-slate-400 italic text-center">Belum ada naskah. Simpan parameter lalu klik Generate.</p>';
  const w = words(t); $('#count').textContent = t ? `${w.toLocaleString('id-ID')} kata, perkiraan ${(w / WPP).toFixed(1)} halaman (TNR 12, spasi 1,5).` : '';
}
function toggleEdit() {
  const ed = $('#ed'), pv = $('#paper');
  if (ed.classList.contains('hidden')) { ed.value = S.babs[cur] || ''; ed.classList.remove('hidden'); pv.classList.add('hidden'); }
  else { S.babs[cur] = ed.value; save(); ed.classList.add('hidden'); pv.classList.remove('hidden'); render(); }
}
function saveProj(msg) {
  const g = id => $('#' + id)?.value ?? '';
  const old = S.p.judul;
  Object.assign(S.p, { judul:g('f-judul').trim(), jenis:g('f-jenis'), metode:g('f-metode'), nama:g('f-nama'), nim:g('f-nim'), prodi:g('f-prodi'), data:g('f-data') });
  if (S.p.judul !== old) S.refs = [];
  save(); if (msg) alert('Parameter proyek tersimpan.');
}

// ---------- Generate naskah bertahap (subbab demi subbab agar panjang) ----------
const busy = b => { $('#gen').disabled = b; $('#stp').classList.toggle('hidden', !b); };
async function gen(n) {
  saveProj(false);
  if (!S.p.judul) return alert('Isi judul skripsi terlebih dahulu.');
  stop = false; busy(true);
  try {
    if (!S.refs.length) {
      status('Mencari referensi jurnal nyata di OpenAlex...');
      try { S.refs = await findRefs(S.p.judul, 25); save(); } catch (e) { S.refs = []; }
    }
    const refText = S.refs.length ? S.refs.map((r, i) => `${i + 1}. (${r.key}) ${r.full}`).join('\n') : '(tidak ada referensi terverifikasi; tulis tanpa sitasi)';
    const heads = OUT[n].map(x => x.split('|')[0]).join('; ');
    const ctx = n > 1 ? `Ringkasan Bab I (untuk konsistensi):\n${(S.babs[1] || '').slice(0, 1800)}` : '';
    const dataRule = n >= 4 ? `\nData penelitian dari mahasiswa:\n${S.p.data || '(KOSONG)'}\nAturan: pakai hanya angka dan temuan dari data di atas. Jika data kosong atau kurang, JANGAN mengarang angka/hasil; tulis kerangka pembahasan dan beri penanda [ISI DATA: apa yang harus diisi] di tempat angka atau temuan seharusnya muncul.` : '';
    let out = `# BAB ${ROM[n]}\n# ${NAMA[n]}\n`, prev = '';
    for (let i = 0; i < OUT[n].length; i++) {
      if (stop) break;
      const [h, w] = OUT[n][i].split('|');
      status(`Bab ${ROM[n]}: ${h} (${i + 1}/${OUT[n].length})...`);
      const prompt = `Tulis isi subbab "${h}" pada BAB ${ROM[n]} ${NAMA[n]} ${S.p.jenis}.\nJudul penelitian: ${S.p.judul}\nMetode: ${S.p.metode}\nProdi/Kampus: ${S.p.prodi}\nDaftar subbab bab ini: ${heads}\n${ctx}\nPANJANG: minimal ${w} kata (targetkan ${Math.round(w * 1.1)}), paragraf utuh dan mendalam, bukan ringkasan.\nJangan menulis judul subbab; langsung paragraf (sub-subjudul dengan awalan ### boleh dipakai).\nSitasi gaya (Penulis, tahun) HANYA dari daftar terverifikasi ini dan hanya jika benar-benar relevan:\n${refText}\n${prev ? `Bagian sebelumnya berakhir dengan: "${prev}"` : ''}${dataRule}`;
      const t = (await ai(prompt, SYS, Math.min(32000, w * 3 + 1500))).trim();
      out += `\n## ${h}\n${t}\n`; prev = t.slice(-300);
      S.babs[n] = out; save(); render();
    }
    status(stop ? 'Dihentikan. Naskah sebagian tersimpan.' : `Bab ${ROM[n]} selesai. Periksa, edit, dan sesuaikan dengan panduan kampus Anda.`);
  } catch (e) { status('Gagal: ' + e.message); alert('Gagal menghasilkan naskah: ' + e.message); }
  busy(false);
}

// ---------- Unduh Word ----------
function dl() {
  const D = docx, F = 'Times New Roman';
  const run = (t, o = {}) => new D.TextRun({ text: t, font: F, size: 24, ...o });
  const kids = [];
  const ctr = (t, o = {}) => kids.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing: { after: 240 }, children: [run(t, { bold: true, ...o })] }));
  ['', S.p.jenis.split(' ')[0].toUpperCase()].forEach(t => t && ctr(t));
  ctr((S.p.judul || 'JUDUL').toUpperCase());
  ctr('Disusun oleh:', { bold: false }); ctr(S.p.nama || 'Nama'); ctr('NIM. ' + (S.p.nim || '-')); ctr((S.p.prodi || '').toUpperCase());
  let all = '', pb = false;
  for (let n = 1; n <= 5; n++) {
    const t = S.babs[n]; if (!t) continue; all += ' ' + t;
    t.split(/\n+/).forEach(l => {
      l = clean(l.trim()); if (!l) return;
      if (l.startsWith('# ')) { const first = l.startsWith('# BAB'); kids.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, pageBreakBefore: first, spacing: { after: 120 }, children: [run(l.slice(2).toUpperCase(), { bold: true })] })); }
      else if (l.startsWith('## ')) kids.push(new D.Paragraph({ spacing: { before: 240, after: 120 }, children: [run(l.slice(3), { bold: true })] }));
      else if (l.startsWith('### ')) kids.push(new D.Paragraph({ spacing: { before: 160, after: 80 }, children: [run(l.slice(4), { bold: true, italics: true })] }));
      else kids.push(new D.Paragraph({ alignment: D.AlignmentType.JUSTIFIED, spacing: { line: 360 }, indent: { firstLine: 720 }, children: [run(l)] }));
    });
  }
  if (!all.trim()) return alert('Belum ada naskah untuk diunduh.');
  const used = S.refs.filter(r => all.includes(r.last) && all.includes(String(r.y))).sort((a, b) => a.full.localeCompare(b.full));
  if (used.length) {
    kids.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, pageBreakBefore: true, spacing: { after: 240 }, children: [run('DAFTAR PUSTAKA', { bold: true })] }));
    used.forEach(r => kids.push(new D.Paragraph({ spacing: { after: 120 }, indent: { left: 720, hanging: 720 }, children: [run(r.full)] })));
  }
  const doc = new D.Document({ sections: [{
    properties: { page: { margin: { top: 1701, bottom: 1701, left: 2268, right: 1701 } } },
    footers: { default: new D.Footer({ children: [new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.TextRun({ children: [D.PageNumber.CURRENT], font: F, size: 24 })] })] }) },
    children: kids }] });
  D.Packer.toBlob(doc).then(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Skripsi_' + (S.p.nim || 'draft') + '.docx'; a.click(); });
}

// ---------- Pencarian: OpenAlex / Open Library / Crossref ----------
async function search(v) {
  const q = $('#q').value.trim(); if (!q) return;
  const o = $('#qout'); o.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">Mencari...</p>';
  const card = h => `<div class="bg-white border rounded-xl p-4 text-sm space-y-1">${h}</div>`;
  try {
    if (v === 'artikel') {
      lastFound = await findRefs(q, 10);
      o.innerHTML = lastFound.length ? lastFound.map((r, i) => card(`<div class="font-semibold">${esc(r.full.replace(r.doi, '').trim())}</div><div class="flex justify-between text-xs pt-1"><a class="text-indigo-600 underline" target="_blank" href="${esc(r.doi)}">Buka DOI</a><button onclick="addRef(${i})" class="font-semibold text-emerald-700">+ Simpan ke referensi</button></div>`)).join('') : '<p class="text-center text-xs py-6">Tidak ditemukan.</p>';
    } else if (v === 'ebook') {
      const j = await (await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8&fields=key,title,author_name,first_publish_year`)).json();
      o.innerHTML = (j.docs || []).map(d => card(`<div class="font-semibold">${esc(d.title)}</div><div class="text-xs text-slate-500">${esc((d.author_name || []).slice(0, 3).join(', '))} ${d.first_publish_year || ''}</div><a class="text-xs text-indigo-600 underline" target="_blank" href="https://openlibrary.org${esc(d.key)}">Lihat di Open Library</a>`)).join('') || '<p class="text-center text-xs py-6">Tidak ditemukan.</p>';
    } else {
      const j = await (await fetch(`https://api.crossref.org/works?query.bibliographic=${encodeURIComponent(q)}&rows=3`)).json();
      o.innerHTML = '<p class="text-xs text-slate-500">Kandidat paling mirip di Crossref. Cocokkan judul, penulis, dan tahun dengan referensi Anda:</p>' + (j.message.items || []).map(d => card(`<div class="font-semibold">${esc((d.title || [''])[0])}</div><div class="text-xs text-slate-500">${esc((d.author || []).slice(0, 3).map(a => (a.given || '') + ' ' + (a.family || '')).join(', '))} (${d.issued?.['date-parts']?.[0]?.[0] || '?'}) - ${esc((d['container-title'] || [''])[0])}</div><a class="text-xs text-indigo-600 underline" target="_blank" href="https://doi.org/${esc(d.DOI)}">doi.org/${esc(d.DOI)}</a>`)).join('');
    }
  } catch (e) { o.innerHTML = '<p class="text-center text-xs text-rose-600 py-6">Gagal mengambil data: ' + esc(e.message) + '</p>'; }
}
function addRef(i) { const r = lastFound[i]; if (r && !S.refs.some(x => x.doi === r.doi)) { S.refs.push(r); save(); } alert('Tersimpan. Total referensi: ' + S.refs.length); }

// ---------- Statistik deterministik ----------
function stats() {
  const L = $('#csv').value.trim().split('\n').map(l => l.split(/[,;\t]/).map(x => x.trim()));
  const H = L[0], R = L.slice(1).map(r => r.map(Number)).filter(r => r.length === H.length && r.every(x => !isNaN(x)));
  const n = R.length, k = H.length, o = $('#sout');
  if (n < 3 || k < 2) { o.textContent = 'Butuh minimal 3 baris data numerik dan 2 kolom.'; return; }
  const col = j => R.map(r => r[j]), mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const vr = a => { const m = mean(a); return a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1); };
  const cor = (a, b) => { const ma = mean(a), mb = mean(b); let s = 0, x = 0, y = 0; a.forEach((v, i) => { s += (v - ma) * (b[i] - mb); x += (v - ma) ** 2; y += (b[i] - mb) ** 2; }); return s / Math.sqrt(x * y); };
  const tot = R.map(r => r.reduce((s, x) => s + x, 0));
  const alpha = k / (k - 1) * (1 - H.reduce((s, _, j) => s + vr(col(j)), 0) / vr(tot));
  const df = n - 2, tc = 1.96 + 2.4 / df + 3.1 / df ** 2, rt = tc / Math.sqrt(df + tc * tc);
  o.innerHTML = `<p class="mb-2">N = ${n}, butir = ${k}. r tabel (pendekatan, α 0,05, df ${df}) ≈ ${rt.toFixed(3)}.</p><table class="w-full text-left border-collapse"><tr class="bg-slate-100">${['Butir','Rata-rata','SD','r butir-total','Validitas'].map(h => `<th class="p-2 border">${h}</th>`).join('')}</tr>` +
    H.map((h, j) => { const c = col(j), r = cor(c, tot.map((t, i) => t - c[i])); return `<tr><td class="p-2 border">${esc(h)}</td><td class="p-2 border">${mean(c).toFixed(2)}</td><td class="p-2 border">${Math.sqrt(vr(c)).toFixed(2)}</td><td class="p-2 border">${r.toFixed(3)}</td><td class="p-2 border">${r > rt ? 'Valid' : 'Tidak valid'}</td></tr>`; }).join('') +
    `</table><p class="mt-2 font-semibold">Cronbach's Alpha = ${alpha.toFixed(3)} (${alpha >= 0.7 ? 'reliabel' : 'kurang reliabel'}, batas umum 0,70)</p>`;
}

// ---------- Pengaturan ----------
function badge() { const b = $('#badge'); b.textContent = S.key ? S.model : 'API key belum diisi'; b.className = 'text-xs px-2 py-1 rounded-full font-semibold ' + (S.key ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'); }
function openSet() { $('#set-key').value = S.key; $('#set-model').value = S.model; $('#modal').classList.remove('hidden'); }
function saveSet() { S.key = $('#set-key').value.trim(); S.model = $('#set-model').value; save(); badge(); $('#modal').classList.add('hidden'); }
badge(); nav('studio');
</script>
